name: shadowwall_ai
description: ShadowWall AI – Intelligent Mobile Cyber Safety Companion Using Context-Aware AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Material & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.4.1
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.2
  firebase_messaging: ^15.1.1
  firebase_storage: ^12.3.1

  # Authentication
  google_sign_in: ^6.2.1
  local_auth: ^2.3.0

  # AI & ML
  tflite_flutter: ^0.11.0
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_text_recognition: ^0.13.1

  # Local Storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  # Security
  freerasp: ^6.1.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # PDF & Export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilities
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.5.0
  crypto: ^3.0.5
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  flutter_local_notifications: ^17.2.3
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  installed_apps: ^1.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.1
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env

